name: release

# release-please watches Conventional Commits on main and maintains a release PR.
# Merging that PR bumps every package.json, writes CHANGELOG.md, tags vX.Y.Z, and
# creates the GitHub release — which then gates the CLI publish job below.
#
# Publishing runs in this workflow rather than on a `v*` tag trigger: tags pushed with
# the default GITHUB_TOKEN do not start other workflows, so a tag-triggered job would
# never fire.
#
# Required secrets: NPM_TOKEN, RELEASE_APP_ID, RELEASE_APP_PRIVATE_KEY.
# The app credentials are exchanged at runtime for a one-hour installation token
# scoped to emitsignal/homebrew-tap — the default GITHUB_TOKEN cannot reach another
# repository.
on:
    push:
        branches: [main]

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
            version: ${{ steps.release.outputs.version }}
        steps:
            - uses: googleapis/release-please-action@v4
              id: release
              with:
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

            # release-please writes package.json with expanded arrays that Prettier
            # collapses, so an unformatted release PR turns main red on merge.
            - name: Check out the release PR
              if: steps.release.outputs.prs != '' && steps.release.outputs.prs != '[]'
              uses: actions/checkout@v4
              with:
                  # `--amend` below needs the real parent, not a shallow graft.
                  fetch-depth: 0
                  ref: ${{ fromJSON(steps.release.outputs.prs)[0].headBranchName }}

            - name: Set up Bun
              if: steps.release.outputs.prs != '' && steps.release.outputs.prs != '[]'
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3.13'

            - name: Format the release PR
              if: steps.release.outputs.prs != '' && steps.release.outputs.prs != '[]'
              run: |
                  bun install
                  bun format

                  # Lockfile churn from the install is release-please's business.
                  git checkout -- bun.lock

                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add -A

                  if git diff --cached --quiet; then
                      echo "release PR is already formatted"
                      exit 0
                  fi

                  # Amended, not added: the repo rebase-merges, so a second commit would
                  # land on main separately. release-please rewrites this branch anyway.
                  git commit --amend --no-edit
                  git push --force-with-lease

    publish-cli:
        needs: release-please
        if: needs.release-please.outputs.release_created == 'true'
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: packages/emitsignal-cli
        env:
            TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
            VERSION: ${{ needs.release-please.outputs.version }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ needs.release-please.outputs.tag_name }}

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3.13'

            # Not --frozen-lockfile: release-please bumps every package.json version but
            # cannot update bun.lock, which records workspace versions too. A frozen
            # install would fail here and the release would tag without ever publishing.
            - name: Install dependencies
              run: bun install
              working-directory: .

            - name: Verify tag matches package version
              run: |
                  PKG_VERSION="$(bun --print "require('./package.json').version")"
                  if [ "$VERSION" != "$PKG_VERSION" ]; then
                      echo "::error::release $TAG_NAME does not match package.json version $PKG_VERSION"
                      exit 1
                  fi

            # ── Track A: npm ────────────────────────────────────────────────
            # NPM_CONFIG_TOKEN rather than a written .npmrc: a secret carrying a stray
            # newline silently produced an empty `_authToken=` line, which bun reports as
            # "missing authentication" — indistinguishable from an unset secret.
            - name: Publish to npm
              run: |
                  NPM_CONFIG_TOKEN="$(printf '%s' "$NPM_TOKEN" | tr -d '[:space:]')"
                  if [ -z "$NPM_CONFIG_TOKEN" ]; then
                      echo "::error::NPM_TOKEN is empty or whitespace-only"
                      exit 1
                  fi
                  export NPM_CONFIG_TOKEN
                  bun publish --access public
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

            # ── Track B: standalone binaries ────────────────────────────────
            - name: Build standalone binaries
              run: bun run build:binaries

            - name: Attach binaries to the release
              run: |
                  gh release upload "$TAG_NAME" \
                      --repo "$GITHUB_REPOSITORY" \
                      dist-bin/emitsignal-*.tar.gz \
                      dist-bin/checksums.txt \
                      scripts/install.sh
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # ── Homebrew tap ────────────────────────────────────────────────
            - name: Mint a token for the tap repo
              id: tap-token
              uses: actions/create-github-app-token@v2
              with:
                  app-id: ${{ secrets.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  owner: emitsignal
                  repositories: homebrew-tap

            - name: Render and push Homebrew formula
              run: |
                  git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/emitsignal/homebrew-tap.git" /tmp/tap
                  mkdir -p /tmp/tap/Formula
                  bun run render:formula --tag "$TAG_NAME" --out /tmp/tap/Formula/emitsignal.rb
                  cd /tmp/tap
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add Formula/emitsignal.rb
                  git commit -m "chore: emitsignal ${VERSION}" || echo "no formula changes"
                  git push
              env:
                  TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}
