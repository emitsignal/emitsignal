# Production docker-compose
#
# Copy .env.example → .env and fill in the required values before running.
#
# Run from the monorepo root:
#   docker compose -f packages/emitsignal-docker/docker-compose.yml up -d
#

# Cap per-container JSON log files so they cannot grow disk unbounded.
x-logging: &default-logging
    driver: json-file
    options:
        max-file: '3'
        max-size: '10m'

services:
    otel-collector:
        environment:
            OTEL_EXPORTER_ENDPOINT: '${OTEL_EXPORTER_ENDPOINT}'
            OTEL_EXPORTER_AUTH_TOKEN: '${OTEL_EXPORTER_AUTH_TOKEN}'
        image: otel/opentelemetry-collector-contrib:0.156.0
        logging: *default-logging
        mem_limit: 256m
        restart: unless-stopped
        volumes:
            - ./otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml

    postgres:
        environment:
            POSTGRES_DB: emitsignal
            POSTGRES_USER: emitsignal
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        healthcheck:
            interval: 10s
            retries: 5
            test: ['CMD-SHELL', 'pg_isready -U emitsignal -d emitsignal']
            timeout: 5s
        image: postgres:16-alpine
        logging: *default-logging
        mem_limit: 1g
        ports:
            - '127.0.0.1:5432:5432'
        restart: unless-stopped
        volumes:
            - postgres_data:/var/lib/postgresql/data

    redis:
        command:
            [
                'redis-server',
                '--requirepass',
                '${REDIS_PASSWORD}',
                '--maxmemory',
                '512mb',
                '--maxmemory-policy',
                'noeviction',
            ]
        environment:
            # Lets redis-cli (healthcheck) authenticate without a plaintext flag.
            REDISCLI_AUTH: ${REDIS_PASSWORD}
        healthcheck:
            interval: 10s
            retries: 5
            test: ['CMD', 'redis-cli', 'ping']
            timeout: 5s
        image: redis:7-alpine
        logging: *default-logging
        mem_limit: 640m
        ports:
            - '127.0.0.1:6379:6379'
        restart: unless-stopped
        volumes:
            - redis_data:/data
    migrate:
        build:
            context: ../..
            dockerfile: packages/emitsignal-docker/server/Dockerfile
        command: ['prisma', 'migrate', 'deploy']
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            DATABASE_URL: 'postgresql://emitsignal:${POSTGRES_PASSWORD}@postgres:5432/emitsignal'
        image: emitsignal-server:latest
        logging: *default-logging
        restart: 'no'

    server:
        build:
            context: ../..
            dockerfile: packages/emitsignal-docker/server/Dockerfile
        command: ['bun', 'src/index.ts']
        depends_on:
            migrate:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            otel-collector:
                condition: service_started
        environment:
            API_URL: '${API_URL:-http://localhost:5001}'
            APP_URL: '${APP_URL:-http://localhost:5002}'
            APPLE_APP_BUNDLE_IDENTIFIER: '${APPLE_APP_BUNDLE_IDENTIFIER:-}'
            APPLE_CLIENT_ID: '${APPLE_CLIENT_ID:-}'
            APPLE_KEY_ID: '${APPLE_KEY_ID:-}'
            APPLE_PRIVATE_KEY: '${APPLE_PRIVATE_KEY:-}'
            APPLE_TEAM_ID: '${APPLE_TEAM_ID:-}'
            AUTH_ALLOWED_EMAILS: '${AUTH_ALLOWED_EMAILS:-}'
            BETTER_AUTH_SECRET: '${BETTER_AUTH_SECRET}'
            DATABASE_URL: 'postgresql://emitsignal:${POSTGRES_PASSWORD}@postgres:5432/emitsignal'
            EMAIL_FROM: '${EMAIL_FROM:-EmitSignal <noreply@emitsignal.com>}'
            EMAIL_PROVIDER: '${EMAIL_PROVIDER:-log}'
            EMIT_SIGNAL_HTTP_PORT: '5001'
            FILE_STORAGE_PROVIDER: '${FILE_STORAGE_PROVIDER:-local}'
            GITHUB_CLIENT_ID: '${GITHUB_CLIENT_ID:-}'
            GITHUB_CLIENT_SECRET: '${GITHUB_CLIENT_SECRET:-}'
            LOG_INGESTION_ENABLED: '${LOG_INGESTION_ENABLED:-false}'
            LOG_INGESTION_HOST: '${LOG_INGESTION_HOST:-}'
            LOG_INGESTION_PROVIDER: '${LOG_INGESTION_PROVIDER:-stdout}'
            LOG_INGESTION_TOKEN: '${LOG_INGESTION_TOKEN:-}'
            NODE_ENV: 'production'
            OTEL_ENABLED: '${OTEL_ENABLED:-false}'
            OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector:4318'
            OTEL_SERVICE_NAME: '${OTEL_SERVICE_NAME:-emitsignal-server}'
            OTEL_TRACES_SAMPLE_RATE: '${OTEL_TRACES_SAMPLE_RATE:-1}'
            REDIS_URL: 'redis://:${REDIS_PASSWORD}@redis:6379'
            RESEND_API_KEY: '${RESEND_API_KEY:-}'
            S3_ACCESS_KEY_ID: '${S3_ACCESS_KEY_ID:-}'
            S3_ENDPOINT: '${S3_ENDPOINT:-}'
            S3_PRIVATE_BUCKET_NAME: '${S3_PRIVATE_BUCKET_NAME:-}'
            S3_PUBLIC_BUCKET_NAME: '${S3_PUBLIC_BUCKET_NAME:-}'
            S3_PUBLIC_URL_BASE: '${S3_PUBLIC_URL_BASE:-}'
            S3_REGION: '${S3_REGION:-}'
            S3_SECRET_ACCESS_KEY: '${S3_SECRET_ACCESS_KEY:-}'
            SENTRY_DSN: '${SENTRY_DSN:-}'
            SENTRY_ENABLED: '${SENTRY_ENABLED:-false}'
            SMTP_HOST: '${SMTP_HOST:-}'
            SMTP_PASS: '${SMTP_PASS:-}'
            SMTP_PORT: '${SMTP_PORT:-587}'
            SMTP_USER: '${SMTP_USER:-}'
            STRIPE_PRICE_BEAM_MONTHLY: '${STRIPE_PRICE_BEAM_MONTHLY:-}'
            STRIPE_PRICE_BEAM_YEARLY: '${STRIPE_PRICE_BEAM_YEARLY:-}'
            STRIPE_PRICE_PULSE_MONTHLY: '${STRIPE_PRICE_PULSE_MONTHLY:-}'
            STRIPE_PRICE_PULSE_YEARLY: '${STRIPE_PRICE_PULSE_YEARLY:-}'
            STRIPE_SECRET_KEY: '${STRIPE_SECRET_KEY:-}'
            STRIPE_WEBHOOK_SECRET: '${STRIPE_WEBHOOK_SECRET:-}'
            TRUSTED_PROXY_HEADER: '${TRUSTED_PROXY_HEADER:-none}'
            UPLOAD_DIR: './uploads'
        healthcheck:
            interval: 15s
            retries: 5
            start_period: 30s
            test:
                [
                    'CMD',
                    'bun',
                    '-e',
                    "fetch('http://127.0.0.1:5001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            timeout: 5s
        image: emitsignal-server:latest
        labels:
            - 'traefik.enable=true'
            - 'traefik.http.routers.emitsignal-server.rule=Host(`${API_DOMAIN}`)'
            - 'traefik.http.routers.emitsignal-server.entrypoints=websecure'
            - 'traefik.http.routers.emitsignal-server.tls.certresolver=letsencrypt'
            # Proxied: POST https://${APP_DOMAIN}/publish/<topic>
            - 'traefik.http.routers.emitsignal-publish.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/publish`)'
            - 'traefik.http.routers.emitsignal-publish.entrypoints=websecure'
            - 'traefik.http.routers.emitsignal-publish.tls.certresolver=letsencrypt'
            - 'traefik.http.routers.emitsignal-publish.priority=1000'
            - 'traefik.http.routers.emitsignal-publish.service=emitsignal-server'
            - 'traefik.http.services.emitsignal-server.loadbalancer.server.port=5001'
        logging: *default-logging
        mem_limit: 1g
        networks:
            - dokploy-network
            - default
        ports:
            - '127.0.0.1:5001:5001'
        restart: unless-stopped
        volumes:
            - server_uploads:/app/packages/emitsignal-server/uploads

    # Reuses the image built by the `server` service (same Dockerfile) so the
    # image is built exactly once per deploy instead of twice.
    worker:
        command: ['bun', 'src/workers/all.ts']
        depends_on:
            migrate:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            otel-collector:
                condition: service_started
        environment:
            API_URL: '${API_URL:-http://localhost:5001}'
            APP_URL: '${APP_URL:-http://localhost:5002}'
            LOG_INGESTION_HOST: '${LOG_INGESTION_HOST:-}'
            LOG_INGESTION_PROVIDER: '${LOG_INGESTION_PROVIDER:-stdout}'
            LOG_INGESTION_TOKEN: '${LOG_INGESTION_TOKEN:-}'
            NODE_ENV: 'production'
            BETTER_AUTH_SECRET: '${BETTER_AUTH_SECRET}'
            DATABASE_URL: 'postgresql://emitsignal:${POSTGRES_PASSWORD}@postgres:5432/emitsignal'
            EMAIL_FROM: '${EMAIL_FROM:-EmitSignal <noreply@emitsignal.com>}'
            EMAIL_PROVIDER: '${EMAIL_PROVIDER:-log}'
            EXPO_ACCESS_TOKEN: '${EXPO_ACCESS_TOKEN:-}'
            FILE_STORAGE_PROVIDER: '${FILE_STORAGE_PROVIDER:-local}'
            GITHUB_CLIENT_ID: '${GITHUB_CLIENT_ID:-}'
            GITHUB_CLIENT_SECRET: '${GITHUB_CLIENT_SECRET:-}'
            OTEL_ENABLED: '${OTEL_ENABLED:-false}'
            OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector:4318'
            OTEL_WORKER_SERVICE_NAME: '${OTEL_WORKER_SERVICE_NAME:-emitsignal-worker}'
            OTEL_TRACES_SAMPLE_RATE: '${OTEL_TRACES_SAMPLE_RATE:-1}'
            REDIS_URL: 'redis://:${REDIS_PASSWORD}@redis:6379'
            RESEND_API_KEY: '${RESEND_API_KEY:-}'
            S3_ACCESS_KEY_ID: '${S3_ACCESS_KEY_ID:-}'
            S3_ENDPOINT: '${S3_ENDPOINT:-}'
            S3_PRIVATE_BUCKET_NAME: '${S3_PRIVATE_BUCKET_NAME:-}'
            S3_PUBLIC_BUCKET_NAME: '${S3_PUBLIC_BUCKET_NAME:-}'
            S3_PUBLIC_URL_BASE: '${S3_PUBLIC_URL_BASE:-}'
            S3_REGION: '${S3_REGION:-}'
            S3_SECRET_ACCESS_KEY: '${S3_SECRET_ACCESS_KEY:-}'
            SENTRY_DSN: '${SENTRY_DSN:-}'
            SENTRY_ENABLED: '${SENTRY_ENABLED:-false}'
            SMTP_HOST: '${SMTP_HOST:-}'
            SMTP_PASS: '${SMTP_PASS:-}'
            SMTP_PORT: '${SMTP_PORT:-587}'
            SMTP_USER: '${SMTP_USER:-}'
            UPLOAD_DIR: './uploads'
        image: emitsignal-server:latest
        logging: *default-logging
        mem_limit: 1g
        restart: unless-stopped
        volumes:
            - server_uploads:/app/packages/emitsignal-server/uploads

    website:
        build:
            context: ../..
            dockerfile: packages/emitsignal-docker/website/Dockerfile
            args:
                VITE_API_URL: '${API_URL:-http://localhost:5001}'
                VITE_PUBLISH_BASE_URL: '${PUBLISH_BASE_URL:-}'
                VITE_SENTRY_DSN: '${VITE_SENTRY_DSN:-}'
                VITE_SENTRY_ENABLED: '${VITE_SENTRY_ENABLED:-false}'
        environment:
            OG_SIGNING_SECRET: '${OG_SIGNING_SECRET}'
            # Same DSN as the client build (VITE_SENTRY_DSN): SSR and browser
            # are the same Sentry project, distinguished automatically by SDK name.
            SENTRY_DSN: '${VITE_SENTRY_DSN:-}'
            SENTRY_ENABLED: '${VITE_SENTRY_ENABLED:-false}'
        healthcheck:
            interval: 15s
            retries: 5
            start_period: 30s
            test:
                [
                    'CMD',
                    'bun',
                    '-e',
                    "fetch('http://127.0.0.1:5000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            timeout: 5s
        labels:
            - 'traefik.enable=true'
            - 'traefik.http.routers.emitsignal-website.rule=Host(`${APP_DOMAIN}`)'
            - 'traefik.http.routers.emitsignal-website.entrypoints=websecure'
            - 'traefik.http.routers.emitsignal-website.tls.certresolver=letsencrypt'
            - 'traefik.http.services.emitsignal-website.loadbalancer.server.port=5000'
        logging: *default-logging
        mem_limit: 512m
        networks:
            - dokploy-network
            - default
        restart: unless-stopped
        depends_on:
            server:
                condition: service_healthy

volumes:
    postgres_data:
    redis_data:
    server_uploads:

networks:
    dokploy-network:
        external: true
