name: release-cli

# Cut a CLI release by pushing a tag:  git tag cli-v1.2.3 && git push origin cli-v1.2.3
# The tag version must match packages/emitsignal-cli/package.json.
#
# Assumes this repo is emitsignal/emitsignal (the GitHub release is created here
# via the default GITHUB_TOKEN). The Homebrew formula is pushed to the separate
# emitsignal/homebrew-tap repo, which needs a cross-repo PAT (TAP_GITHUB_TOKEN).
#
# Required secrets: NPM_TOKEN, TAP_GITHUB_TOKEN.
on:
    push:
        tags:
            - 'cli-v*'

permissions:
    contents: write # create the GitHub release + upload assets

jobs:
    release:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: packages/emitsignal-cli
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3.13'

            - name: Install dependencies
              run: bun install --frozen-lockfile
              working-directory: .

            - name: Verify tag matches package version
              run: |
                  TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
                  PKG_VERSION="$(bun --print "require('./package.json').version")"
                  if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
                      echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
                      exit 1
                  fi

            # ── Track A: npm ────────────────────────────────────────────────
            - name: Publish to npm
              run: |
                  echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
                  bun publish --access public
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

            # ── Track B: standalone binaries ────────────────────────────────
            - name: Build standalone binaries
              run: bun run build:binaries

            - name: Create GitHub release
              run: |
                  gh release create "$GITHUB_REF_NAME" \
                      --repo "$GITHUB_REPOSITORY" \
                      --title "CLI $GITHUB_REF_NAME" \
                      --generate-notes \
                      dist-bin/emitsignal-*.tar.gz \
                      dist-bin/checksums.txt \
                      scripts/install.sh
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # ── Homebrew tap ────────────────────────────────────────────────
            - name: Render and push Homebrew formula
              run: |
                  git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/emitsignal/homebrew-tap.git" /tmp/tap
                  mkdir -p /tmp/tap/Formula
                  bun run render:formula --tag "$GITHUB_REF_NAME" --out /tmp/tap/Formula/emitsignal.rb
                  cd /tmp/tap
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add Formula/emitsignal.rb
                  git commit -m "chore: emitsignal ${GITHUB_REF_NAME#cli-v}" || echo "no formula changes"
                  git push
              env:
                  TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
