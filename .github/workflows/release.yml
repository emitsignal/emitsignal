name: release

# release-please watches Conventional Commits on main and maintains a release PR.
# Merging that PR bumps every package.json, writes CHANGELOG.md, tags vX.Y.Z, and
# creates the GitHub release — which then gates the CLI publish job below.
#
# Publishing runs in this workflow rather than on a `v*` tag trigger: tags pushed with
# the default GITHUB_TOKEN do not start other workflows, so a tag-triggered job would
# never fire.
#
# Required secrets: NPM_TOKEN, RELEASE_APP_ID, RELEASE_APP_PRIVATE_KEY.
# The app credentials are exchanged at runtime for a one-hour installation token
# scoped to emitsignal/homebrew-tap — the default GITHUB_TOKEN cannot reach another
# repository.
on:
    push:
        branches: [main]

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
            version: ${{ steps.release.outputs.version }}
        steps:
            - uses: googleapis/release-please-action@v4
              id: release
              with:
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

            # release-please serializes package.json with its own JSON writer, which
            # expands short arrays that Prettier collapses. Left alone, merging the
            # release PR lands unformatted files on main, and `format:check` then fails
            # on main and on every branch cut from it until someone formats by hand.
            #
            # Guarded on the `prs` output rather than `prs_created` so this also runs
            # when release-please updates an existing release PR, not just on creation.
            - name: Check out the release PR
              if: steps.release.outputs.prs != '' && steps.release.outputs.prs != '[]'
              uses: actions/checkout@v4
              with:
                  ref: ${{ fromJSON(steps.release.outputs.prs)[0].headBranchName }}

            - name: Set up Bun
              if: steps.release.outputs.prs != '' && steps.release.outputs.prs != '[]'
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3.13'

            - name: Format the release PR
              if: steps.release.outputs.prs != '' && steps.release.outputs.prs != '[]'
              run: |
                  bun install
                  bun format

                  # bun install rewrites bun.lock off the bumped versions; that belongs to
                  # release-please, not to a formatting commit.
                  git checkout -- bun.lock

                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add -A

                  if git diff --cached --quiet; then
                      echo "release PR is already formatted"
                      exit 0
                  fi

                  git commit -m "chore: Source Format"
                  git push

    publish-cli:
        needs: release-please
        if: needs.release-please.outputs.release_created == 'true'
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: packages/emitsignal-cli
        env:
            TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
            VERSION: ${{ needs.release-please.outputs.version }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ needs.release-please.outputs.tag_name }}

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3.13'

            # Not --frozen-lockfile: release-please bumps every package.json version but
            # cannot update bun.lock, which records workspace versions too. A frozen
            # install would fail here and the release would tag without ever publishing.
            - name: Install dependencies
              run: bun install
              working-directory: .

            - name: Verify tag matches package version
              run: |
                  PKG_VERSION="$(bun --print "require('./package.json').version")"
                  if [ "$VERSION" != "$PKG_VERSION" ]; then
                      echo "::error::release $TAG_NAME does not match package.json version $PKG_VERSION"
                      exit 1
                  fi

            # ── Track A: npm ────────────────────────────────────────────────
            - name: Publish to npm
              run: |
                  echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
                  bun publish --access public
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

            # ── Track B: standalone binaries ────────────────────────────────
            - name: Build standalone binaries
              run: bun run build:binaries

            - name: Attach binaries to the release
              run: |
                  gh release upload "$TAG_NAME" \
                      --repo "$GITHUB_REPOSITORY" \
                      dist-bin/emitsignal-*.tar.gz \
                      dist-bin/checksums.txt \
                      scripts/install.sh
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # ── Homebrew tap ────────────────────────────────────────────────
            - name: Mint a token for the tap repo
              id: tap-token
              uses: actions/create-github-app-token@v2
              with:
                  app-id: ${{ secrets.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  owner: emitsignal
                  repositories: homebrew-tap

            - name: Render and push Homebrew formula
              run: |
                  git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/emitsignal/homebrew-tap.git" /tmp/tap
                  mkdir -p /tmp/tap/Formula
                  bun run render:formula --tag "$TAG_NAME" --out /tmp/tap/Formula/emitsignal.rb
                  cd /tmp/tap
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add Formula/emitsignal.rb
                  git commit -m "chore: emitsignal ${VERSION}" || echo "no formula changes"
                  git push
              env:
                  TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}
