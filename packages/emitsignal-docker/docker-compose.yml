# Production docker-compose
#
# Copy .env.example → .env and fill in the required values before running.
#
# Run from the monorepo root:
#   docker compose -f packages/emitsignal-docker/docker-compose.yml up -d
#

services:
    postgres:
        environment:
            POSTGRES_DB: emitsignal
            POSTGRES_USER: emitsignal
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        healthcheck:
            interval: 10s
            retries: 5
            test: ['CMD-SHELL', 'pg_isready -U emitsignal -d emitsignal']
            timeout: 5s
        image: postgres:16-alpine
        restart: unless-stopped
        volumes:
            - postgres_data:/var/lib/postgresql/data

    redis:
        healthcheck:
            interval: 10s
            retries: 5
            test: ['CMD', 'redis-cli', 'ping']
            timeout: 5s
        image: redis:7-alpine
        restart: unless-stopped
        volumes:
            - redis_data:/data

    server:
        build:
            context: ../..
            dockerfile: packages/emitsignal-docker/server/Dockerfile
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        environment:
            APP_URL: '${API_URL:-http://localhost:5100}'
            DATABASE_URL: 'postgresql://emitsignal:${POSTGRES_PASSWORD}@postgres:5432/emitsignal'
            EMAIL_FROM: '${EMAIL_FROM:-EmitSignal <noreply@emitsignal.com>}'
            EMAIL_PROVIDER: '${EMAIL_PROVIDER:-log}'
            EMIT_SIGNAL_HTTP_PORT: '5100'
            FILE_STORAGE_PROVIDER: '${FILE_STORAGE_PROVIDER:-local}'
            JWT_SECRET: '${JWT_SECRET}'
            REDIS_URL: 'redis://redis:6379'
            RESEND_API_KEY: '${RESEND_API_KEY:-}'
            S3_ACCESS_KEY_ID: '${S3_ACCESS_KEY_ID:-}'
            S3_BUCKET_NAME: '${S3_BUCKET_NAME:-}'
            S3_ENDPOINT: '${S3_ENDPOINT:-}'
            S3_REGION: '${S3_REGION:-}'
            S3_SECRET_ACCESS_KEY: '${S3_SECRET_ACCESS_KEY:-}'
            SMTP_HOST: '${SMTP_HOST:-}'
            SMTP_PASS: '${SMTP_PASS:-}'
            SMTP_PORT: '${SMTP_PORT:-587}'
            SMTP_USER: '${SMTP_USER:-}'
            UPLOAD_DIR: './uploads'
        restart: unless-stopped
        ports:
            - '${SERVER_PORT:-5100}:5100'
        volumes:
            - server_uploads:/app/packages/emitsignal-server/uploads

    worker:
        build:
            context: ../..
            dockerfile: packages/emitsignal-docker/server/Dockerfile
        command: ['bun', 'src/workers/all.ts']
        environment:
            APP_URL: '${API_URL:-http://localhost:5100}'
            DATABASE_URL: 'postgresql://emitsignal:${POSTGRES_PASSWORD}@postgres:5432/emitsignal'
            EMAIL_FROM: '${EMAIL_FROM:-EmitSignal <noreply@emitsignal.com>}'
            EMAIL_PROVIDER: '${EMAIL_PROVIDER:-log}'
            FILE_STORAGE_PROVIDER: '${FILE_STORAGE_PROVIDER:-local}'
            JWT_SECRET: '${JWT_SECRET}'
            REDIS_URL: 'redis://redis:6379'
            RESEND_API_KEY: '${RESEND_API_KEY:-}'
            S3_ACCESS_KEY_ID: '${S3_ACCESS_KEY_ID:-}'
            S3_BUCKET_NAME: '${S3_BUCKET_NAME:-}'
            S3_ENDPOINT: '${S3_ENDPOINT:-}'
            S3_REGION: '${S3_REGION:-}'
            S3_SECRET_ACCESS_KEY: '${S3_SECRET_ACCESS_KEY:-}'
            SMTP_HOST: '${SMTP_HOST:-}'
            SMTP_PASS: '${SMTP_PASS:-}'
            SMTP_PORT: '${SMTP_PORT:-587}'
            SMTP_USER: '${SMTP_USER:-}'
            UPLOAD_DIR: './uploads'
        restart: unless-stopped
        volumes:
            - server_uploads:/app/packages/emitsignal-server/uploads
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    website:
        build:
            context: ../..
            dockerfile: packages/emitsignal-docker/website/Dockerfile
            args:
                VITE_API_URL: '${API_URL:-http://localhost:5100}'
        restart: unless-stopped
        ports:
            - '${WEBSITE_PORT:-5000}:3000'
        depends_on:
            - server

volumes:
    postgres_data:
    redis_data:
    server_uploads:
