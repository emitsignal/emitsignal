# Development docker-compose
#
# Provides: Redis, kafrainbox (SMTP + web UI), server with hot-reload,
# worker with hot-reload, and website with Vite HMR.
#
# Run from the monorepo root:
#   docker compose -f packages/emitsignal-docker/docker-compose.dev.yml up
#   docker compose -f packages/emitsignal-docker/docker-compose.dev.yml down
#   docker compose -f packages/emitsignal-docker/docker-compose.dev.yml down -v # stop + wipe data
#
# First start is slower as bun install runs inside each container.
# Subsequent starts use the cached node_modules from the mounted volume.

services:
    postgres:
        environment:
            POSTGRES_DB: emitsignal
            POSTGRES_PASSWORD: emitsignal
            POSTGRES_USER: emitsignal
        image: postgres:16-alpine
        restart: unless-stopped
        ports:
            - '5432:5432'
        healthcheck:
            interval: 5s
            retries: 10
            test: ['CMD-SHELL', 'pg_isready -U emitsignal -d emitsignal']
            timeout: 3s
        volumes:
            - postgres_dev_data:/var/lib/postgresql/data

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        ports:
            - '6379:6379'
        healthcheck:
            interval: 5s
            retries: 10
            test: ['CMD', 'redis-cli', 'ping']
            timeout: 3s
        volumes:
            - redis_dev_data:/data

    kafrainbox:
        environment:
            KAFRAINBOX_DEFAULT_INBOX_PASSWORD: emitsignal
            KAFRAINBOX_DEFAULT_INBOX_USERNAME: emitsignal
        image: kevenleone/kafrainbox:alpha
        restart: unless-stopped
        ports:
            - '1025:1025' # SMTP
            - '3134:3134' # Web UI → http://localhost:3134

    server:
        command: >
            sh -c "cd /app && bun install &&
                   cd /app/packages/emitsignal-server &&
                   bunx prisma db push &&
                   bun run --watch src/index.ts"
        environment:
            APP_URL: 'http://localhost:5100'
            DATABASE_URL: 'postgresql://emitsignal:emitsignal@postgres:5432/emitsignal'
            EMAIL_FROM: 'EmitSignal Dev <dev@emitsignal.local>'
            EMAIL_PROVIDER: 'smtp'
            EMIT_SIGNAL_HTTP_PORT: '5100'
            FILE_STORAGE_PROVIDER: 'local'
            JWT_SECRET: 'emitsignal-dev-jwt-secret'
            REDIS_URL: 'redis://redis:6379'
            SMTP_HOST: 'kafrainbox'
            SMTP_PASS: 'emitsignal'
            SMTP_PORT: '1025'
            SMTP_USER: 'emitsignal'
            UPLOAD_DIR: './uploads'
        image: oven/bun:1
        restart: unless-stopped
        working_dir: /app/packages/emitsignal-server
        volumes:
            - ../../:/app
        ports:
            - '5100:5100'
        depends_on:
            kafrainbox:
                condition: service_started
            postgres:
                condition: service_healthy
            redis:
                condition: service_started

    worker:
        command: >
            sh -c "cd /app && bun install &&
                   cd /app/packages/emitsignal-server &&
                   bun run --watch src/workers/all.ts"
        environment:
            APP_URL: 'http://localhost:5100'
            DATABASE_URL: 'postgresql://emitsignal:emitsignal@postgres:5432/emitsignal'
            EMAIL_FROM: 'EmitSignal Dev <dev@emitsignal.com>'
            EMAIL_PROVIDER: 'smtp'
            FILE_STORAGE_PROVIDER: 'local'
            JWT_SECRET: 'emitsignal-dev-jwt-secret'
            REDIS_URL: 'redis://redis:6379'
            SMTP_HOST: 'kafrainbox'
            SMTP_PASS: 'emitsignal'
            SMTP_PORT: '1025'
            SMTP_USER: 'emitsignal'
            UPLOAD_DIR: './uploads'
        image: oven/bun:1
        restart: unless-stopped
        working_dir: /app/packages/emitsignal-server
        volumes:
            - ../../:/app
        depends_on:
            - postgres
            - redis
            - server

    website:
        command: >
            sh -c "cd /app && bun install &&
                   cd /app/packages/emitsignal-website &&
                   bunx vite dev --port 5173 --host"
        environment:
            VITE_API_URL: 'http://localhost:5100'
        image: oven/bun:1
        restart: unless-stopped
        volumes:
            - ../../:/app
        ports:
            - '5173:5173'
        working_dir: /app/packages/emitsignal-website

volumes:
    postgres_dev_data:
    redis_dev_data:
