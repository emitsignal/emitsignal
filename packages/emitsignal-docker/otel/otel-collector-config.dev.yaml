receivers:
    otlp:
        protocols:
            grpc:
                endpoint: 0.0.0.0:4317
            http:
                endpoint: 0.0.0.0:4318

processors:
    batch:

exporters:
    otlphttp/jaeger:
        endpoint: 'http://jaeger:4318'

    otlphttp/exporter:
        endpoint: '${OTEL_EXPORTER_ENDPOINT}'
        headers:
            Authorization: 'Bearer ${OTEL_EXPORTER_AUTH_TOKEN}'
        compression: gzip

service:
    pipelines:
        traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [otlphttp/jaeger, otlphttp/exporter]
        metrics:
            receivers: [otlp]
            processors: [batch]
            exporters: [otlphttp/exporter]
        logs:
            receivers: [otlp]
            processors: [batch]
            exporters: [otlphttp/exporter]
