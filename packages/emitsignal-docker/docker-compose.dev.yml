# Development docker-compose
#
# Provides: Redis, kafrainbox (SMTP + web UI), server with hot-reload,
# worker with hot-reload, and website with Vite HMR.
#
# Run from the monorepo root:
#   docker compose -f packages/emitsignal-docker/docker-compose.dev.yml up
#   docker compose -f packages/emitsignal-docker/docker-compose.dev.yml down
#   docker compose -f packages/emitsignal-docker/docker-compose.dev.yml down -v # stop + wipe data
#
# First start is slower as bun install runs inside each container.
# Subsequent starts use the cached node_modules from the mounted volume.

services:
    postgres:
        environment:
            POSTGRES_DB: emitsignal
            POSTGRES_PASSWORD: emitsignal
            POSTGRES_USER: emitsignal
        image: postgres:16-alpine
        restart: unless-stopped
        # Bind to loopback only: don't expose the dev DB (weak creds) to the LAN.
        ports:
            - '127.0.0.1:5432:5432'
        healthcheck:
            interval: 5s
            retries: 10
            test: ['CMD-SHELL', 'pg_isready -U emitsignal -d emitsignal']
            timeout: 3s
        volumes:
            - postgres_dev_data:/var/lib/postgresql/data

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        # Bind to loopback only: don't expose an unauthenticated Redis to the LAN.
        ports:
            - '127.0.0.1:6379:6379'
        healthcheck:
            interval: 5s
            retries: 10
            test: ['CMD', 'redis-cli', 'ping']
            timeout: 3s
        volumes:
            - redis_dev_data:/data

    kafrainbox:
        environment:
            KAFRAINBOX_DEFAULT_INBOX_PASSWORD: emitsignal
            KAFRAINBOX_DEFAULT_INBOX_USERNAME: emitsignal
        image: kevenleone/kafrainbox
        restart: unless-stopped
        ports:
            - '127.0.0.1:1025:1025' # SMTP
            - '127.0.0.1:3134:3134' # Web UI → http://localhost:3134

    otel-collector:
        image: otel/opentelemetry-collector-contrib:latest
        restart: unless-stopped
        volumes:
            - ./otel/otel-collector-config.dev.yaml:/etc/otelcol-contrib/config.yaml
        environment:
            OTEL_EXPORTER_ENDPOINT: '${OTEL_EXPORTER_ENDPOINT:-}'
            OTEL_EXPORTER_AUTH_TOKEN: '${OTEL_EXPORTER_AUTH_TOKEN:-}'
        depends_on:
            jaeger:
                condition: service_started
        ports:
            - '127.0.0.1:4317:4317'
            - '127.0.0.1:4318:4318'

    jaeger:
        image: jaegertracing/all-in-one:1.57
        restart: unless-stopped
        environment:
            COLLECTOR_OTLP_ENABLED: 'true'
        ports:
            - '127.0.0.1:16686:16686' # Web UI → http://localhost:16686
        volumes:
            - jaeger_dev_data:/tmp/jaeger

    server:
        command: >
            sh -c "cd /app && bun install &&
                   cd /app/packages/emitsignal-server &&
                   bunx prisma db push &&
                   bun run --watch src/index.ts"
        environment:
            API_URL: 'http://localhost:5100'
            APP_URL: 'http://localhost:5200'
            OTEL_ENABLED: 'true'
            OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector:4318'
            OTEL_SERVICE_NAME: 'emitsignal-server'
            DATABASE_URL: 'postgresql://emitsignal:emitsignal@postgres:5432/emitsignal'
            EMAIL_FROM: 'EmitSignal Dev <dev@emitsignal.local>'
            EMAIL_PROVIDER: 'smtp'
            EMIT_SIGNAL_HTTP_PORT: '5100'
            FILE_STORAGE_PROVIDER: 'local'
            BETTER_AUTH_SECRET: 'emitsignal-dev-better-auth-secret-32chars!!'
            LOG_INGESTION_HOST: '${LOG_INGESTION_HOST:-}'
            LOG_INGESTION_PROVIDER: '${LOG_INGESTION_PROVIDER:-stdout}'
            LOG_INGESTION_TOKEN: '${LOG_INGESTION_TOKEN:-}'
            REDIS_URL: 'redis://redis:6379'
            SENTRY_DSN: '${SENTRY_DSN:-}'
            SENTRY_ENABLED: '${SENTRY_ENABLED:-false}'
            SMTP_HOST: 'kafrainbox'
            SMTP_PASS: 'emitsignal'
            SMTP_PORT: '1025'
            SMTP_USER: 'emitsignal'
            STRIPE_PRICE_BEAM_MONTHLY: '${STRIPE_PRICE_BEAM_MONTHLY:-}'
            STRIPE_PRICE_BEAM_YEARLY: '${STRIPE_PRICE_BEAM_YEARLY:-}'
            STRIPE_PRICE_PULSE_MONTHLY: '${STRIPE_PRICE_PULSE_MONTHLY:-}'
            STRIPE_PRICE_PULSE_YEARLY: '${STRIPE_PRICE_PULSE_YEARLY:-}'
            STRIPE_SECRET_KEY: '${STRIPE_SECRET_KEY:-}'
            STRIPE_WEBHOOK_SECRET: '${STRIPE_WEBHOOK_SECRET:-}'
            UPLOAD_DIR: './uploads'
        image: oven/bun:1
        restart: unless-stopped
        working_dir: /app/packages/emitsignal-server
        volumes:
            - ../../:/app
        ports:
            - '5100:5100'
        depends_on:
            otel-collector:
                condition: service_started
            jaeger:
                condition: service_started
            kafrainbox:
                condition: service_started
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    worker:
        command: >
            sh -c "cd /app && bun install &&
                   cd /app/packages/emitsignal-server &&
                   bun run --watch src/workers/all.ts"
        environment:
            API_URL: 'http://localhost:5100'
            APP_URL: 'http://localhost:5200'
            DATABASE_URL: 'postgresql://emitsignal:emitsignal@postgres:5432/emitsignal'
            OTEL_ENABLED: 'true'
            OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector:4318'
            OTEL_WORKER_SERVICE_NAME: 'emitsignal-worker'
            EMAIL_FROM: 'EmitSignal Dev <dev@emitsignal.com>'
            EMAIL_PROVIDER: 'smtp'
            FILE_STORAGE_PROVIDER: 'local'
            BETTER_AUTH_SECRET: 'emitsignal-dev-better-auth-secret-32chars!!'
            LOG_INGESTION_HOST: '${LOG_INGESTION_HOST:-}'
            LOG_INGESTION_PROVIDER: '${LOG_INGESTION_PROVIDER:-stdout}'
            LOG_INGESTION_TOKEN: '${LOG_INGESTION_TOKEN:-}'
            REDIS_URL: 'redis://redis:6379'
            SENTRY_DSN: '${SENTRY_DSN:-}'
            SENTRY_ENABLED: '${SENTRY_ENABLED:-false}'
            SMTP_HOST: 'kafrainbox'
            SMTP_PASS: 'emitsignal'
            SMTP_PORT: '1025'
            SMTP_USER: 'emitsignal'
            UPLOAD_DIR: './uploads'
        image: oven/bun:1
        restart: unless-stopped
        working_dir: /app/packages/emitsignal-server
        volumes:
            - ../../:/app
        depends_on:
            otel-collector:
                condition: service_started
            jaeger:
                condition: service_started
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            server:
                condition: service_started

    website:
        command: >
            sh -c "cd /app && bun install &&
                   cd /app/packages/emitsignal-website &&
                   bunx vite dev --port 5173 --host"
        environment:
            VITE_API_URL: 'http://localhost:5100'
            VITE_SENTRY_DSN: '${VITE_SENTRY_DSN:-}'
            VITE_SENTRY_ENABLED: '${VITE_SENTRY_ENABLED:-false}'
            # Same DSN as the client build (VITE_SENTRY_DSN): SSR and browser
            # are the same Sentry project, distinguished automatically by SDK name.
            SENTRY_DSN: '${VITE_SENTRY_DSN:-}'
            SENTRY_ENABLED: '${VITE_SENTRY_ENABLED:-false}'
        image: oven/bun:1
        restart: unless-stopped
        volumes:
            - ../../:/app
        ports:
            - '5173:5173'
        working_dir: /app/packages/emitsignal-website

volumes:
    jaeger_dev_data:
    postgres_dev_data:
    redis_dev_data:
